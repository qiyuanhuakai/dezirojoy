name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libx11-6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  package:
    name: package (win-x64)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(dotnet msbuild src/DeziroJoy.App -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained build
        run: >
          dotnet publish src/DeziroJoy.App
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-x64

      - name: Smoke check the published binary
        shell: pwsh
        run: |
          if (-not (Test-Path publish/win-x64/DeziroJoy.exe)) { throw "DeziroJoy.exe missing from publish output" }
          $info = (Get-Item publish/win-x64/DeziroJoy.exe).VersionInfo
          "Product : $($info.ProductName)"
          "Version : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Version mismatch: $($info.ProductVersion)" }

      - uses: actions/upload-artifact@v4
        with:
          name: DeziroJoy-${{ steps.version.outputs.version }}-win-x64
          path: publish/win-x64/
          if-no-files-found: error
