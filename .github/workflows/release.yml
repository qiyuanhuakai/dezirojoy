name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.0.1-alpha.1-preview)'
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained build
        run: >
          dotnet publish src/DeziroJoy.App
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Smoke check the published binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/DeziroJoy.exe"
          if (-not (Test-Path $exe)) { throw "DeziroJoy.exe missing from publish output" }
          $info = (Get-Item $exe).VersionInfo
          "Product : $($info.ProductName)"
          "Version : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Version mismatch: $($info.ProductVersion)" }

      # Linux builds carry no PE version resource and the .NET SDK appends +<sha> to
      # InformationalVersion, so the Windows ProductVersion prefix check has no Linux
      # equivalent. Verify the artefact is an ELF executable of the right architecture,
      # then actually run the headless daemon: a binary whose native libraries fail to
      # resolve exits immediately, while a healthy one is still running when timeout
      # kills it, which is exit code 124.
      - name: Smoke check the published binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          exe="publish/${{ matrix.rid }}/DeziroJoy"
          test -x "$exe" || { echo "not executable: $exe"; exit 1; }
          case "${{ matrix.rid }}" in
            linux-x64)   want="x86-64" ;;
            linux-arm64) want="aarch64" ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          got=$(file -b "$exe")
          echo "file: $got"
          echo "$got" | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          echo "$got" | grep -q "$want" || { echo "wrong architecture, wanted $want"; exit 1; }
          timeout 10 "$exe" --daemon > daemon.log 2>&1
          code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path publish/${{ matrix.rid }}/*
          -DestinationPath DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
          -CompressionLevel Optimal

      - name: Zip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          zip -q -r -9 "../DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" .
          cd -

      - name: Checksum
        shell: bash
        run: sha256sum "DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" > "DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
            DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > body.md <<'NOTES'
          ## DeziroJoy vVERSION (alpha preview)

          首个公开预览版。功能已完整实现，但尚未在真实手柄上做过充分验证，
          欢迎按 [QA 清单](docs/QA-CHECKLIST.md) 测试并反馈问题。

          ### 本版包含

          - 手柄 → 鼠标 / 键盘映射：单键、组合键（Ctrl+C 等）、鼠标按键
          - 摇杆 → 鼠标移动 / 滚轮滚动
          - 内置默认配置（自动识别 Xbox / DualShock / 通用布局）：左摇杆滚轮、
            右摇杆鼠标、十字键方向键、B → Enter、A → Esc、X → Ctrl+C、Y → Ctrl+V
          - 现代化鼠标速度控制：物理单位 px/s（与 DPI / 分辨率解耦）、径向死区、
            4 种响应曲线、指数平滑、亚像素累积、精准模式（按住左摇杆临时降速）、
            面板内实时校准预览
          - 按设备持久化配置；深色界面 + 实时手柄可视化器

           ### 下载

           | 文件 | 平台 | 说明 |
           | --- | --- | --- |
           | `DeziroJoy-vVERSION-win-x64.zip` | Windows | 自包含，解压即用（无需安装 .NET），Intel / AMD 64 位 |
           | `DeziroJoy-vVERSION-win-arm64.zip` | Windows | 同上，ARM64（如骁龙笔记本） |
           | `DeziroJoy-vVERSION-linux-x64.zip` | Linux | 自包含，解压即用，Intel / AMD 64 位 |
           | `DeziroJoy-vVERSION-linux-arm64.zip` | Linux | 同上，ARM64（如树莓派） |
           | `*.sha256` | — | SHA256 校验和 |

           Linux 版需要系统提供 X11 / Wayland 客户端库（`libX11`、`libxcb` 等，
           桌面发行版默认齐全）与 `evdev` / `uinput` 内核模块。读取手柄只需要
           `evdev`；注入鼠标键盘需要 `/dev/uinput` 可写，若不可写应用会明确报告，
           不会静默失效。

           ### 已知限制

           - Windows 上输入读取走 XInput，只能看到 Xbox 布局的标准按键；
             超出该布局的按键（部分第三方手柄的额外宏键）不会被识别。
           - XInput 无法提供稳定硬件 ID，Windows 上配置按 XInput 槽位（#1-#4）
             保存；两个手柄互换插槽时，配置随槽位而非硬件走。Linux 上 evdev
             提供稳定设备路径，按硬件保存。
           - 常驻服务使用 Windows 计划任务的“登录时”触发器，而非开机启动：
             登录前进程运行在会话 0，无法向用户桌面注入输入。
           - Windows 上 SendInput 受 UIPI 约束：非提权进程无法向提权目标注入
             输入，且失败时错误码不指明源于 UIPI。需提权运行，或安装常驻服务。


          ### 质量门禁

          221 个自动化测试全绿（含 headless GUI 测试），Windows 与 Ubuntu 双平台 CI 通过。
          人工验证清单：[docs/QA-CHECKLIST.md](docs/QA-CHECKLIST.md)

          ### 本版提交

          NOTES
          sed -i "s/vVERSION/$VERSION/g" body.md
          echo '```' >> body.md
          if git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            git log --oneline "$(git describe --tags --abbrev=0 HEAD^)..HEAD" >> body.md
          else
            git log --oneline >> body.md
          fi
          echo '```' >> body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "DeziroJoy ${{ steps.version.outputs.tag }}" \
            --notes-file body.md \
            --prerelease \
            artifacts/*/*.zip artifacts/*/*.sha256
