name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.0.1-beta.3-preview)'
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Windows packaging script derives every path from its own location
      # ($PSScriptRoot), and this workflow is its only caller. Recompute that
      # derivation here on every leg: a walk one level short lands on tools/ and
      # each joined path gains a spurious tools\ segment - the beta.1 run failed
      # with ...\tools\tools\Packaging\win\DeziroJoy.iss on both Windows RIDs.
      # The check is static, so it needs no toolchain and runs on any runner.
      - name: Verify packaging path derivation (static)
        shell: bash
        run: |
          set -euo pipefail
          script='tools/Packaging/win/build-and-verify.ps1'
          test -f "$script" || { echo "missing $script"; exit 1; }

          # tools/Packaging/win is the script's own directory; the repository
          # root derivation must walk exactly back to the repository root.
          walk="$(grep -oP "\\\$repoRoot = .*Join-Path \\\$PSScriptRoot '\K[^']*" "$script" || true)"
          if [ -z "$walk" ]; then
            echo "no repository root derivation found in $script"
            exit 1
          fi
          resolved='tools/Packaging/win'
          IFS='/' read -r -a segments <<< "$walk"
          for segment in "${segments[@]}"; do
            if [ "$segment" != '..' ]; then
              echo "unexpected segment '$segment' in repository root derivation"
              exit 1
            fi
            resolved="$(dirname "$resolved")"
          done
          if [ "$resolved" != '.' ]; then
            echo "repository root derives to '$resolved', expected the repository root"
            exit 1
          fi

          # Every repository-relative path the script joins onto that root must
          # exist, or the Windows runner fails mid-build with a missing file.
          while read -r rel; do
            if [ ! -e "$rel" ]; then
              echo "path referenced by $script missing from the repository: $rel"
              exit 1
            fi
          done < <(grep -oP "Join-Path \\\$repoRoot '\K[^']*" "$script" || true)

      # The Windows installer ships a Simplified Chinese interface built from Inno
      # Setup's own ChineseSimplified.isl - which the Inno installer places in the
      # compiler's Languages subdirectory, referenced as
      # compiler:Languages\ChineseSimplified.isl (only Default.isl sits next to
      # ISCC itself) - with English kept as the fallback (M30). Both languages are
      # declared in the .iss [Languages] section, and the wizard's custom texts -
      # the desktop-icon task and the launch-after-install entry - must be
      # referenced through the language files ({cm:...}): a hard-coded English
      # string there would stay English on a Chinese install. This is a static
      # grep, so it needs no Inno install and fails before the publish instead of
      # at the compile; build-and-verify.ps1 additionally checks the resolved
      # ISCC's Languages\ChineseSimplified.isl and its message keys.
      - name: Verify installer localization (static)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          iss='tools/Packaging/win/DeziroJoy.iss'
          test -f "$iss" || { echo "missing $iss"; exit 1; }

          grep -Pq '^\s*Name:\s*"english"\s*;\s*MessagesFile:\s*"compiler:Default\.isl"\s*$' "$iss" \
            || { echo "$iss must keep English (compiler:Default.isl) as the fallback language"; exit 1; }
          grep -Pq '^\s*Name:\s*"chinesesimplified"\s*;\s*MessagesFile:\s*"compiler:Languages\\ChineseSimplified\.isl"\s*$' "$iss" \
            || { echo "$iss must declare Simplified Chinese (compiler:Languages\ChineseSimplified.isl)"; exit 1; }
          grep -Pq '^\s*Name:\s*"desktopicon"\s*;\s*Description:\s*"\{cm:CreateDesktopIcon\}"' "$iss" \
            || { echo "the desktopicon task must be localized through {cm:CreateDesktopIcon}"; exit 1; }
          grep -Pq 'Description:\s*"\{cm:LaunchProgram,\{#MyAppName\}\}"' "$iss" \
            || { echo "the launch-after-install entry must be localized through {cm:LaunchProgram,...}"; exit 1; }
          echo "installer localization declared: english (fallback) + chinesesimplified, custom texts via {cm:...}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained build
        run: >
          dotnet publish src/DeziroJoy.App
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Smoke check the published binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/DeziroJoy.exe"
          if (-not (Test-Path $exe)) { throw "DeziroJoy.exe missing from publish output" }
          $info = (Get-Item $exe).VersionInfo
          "Product : $($info.ProductName)"
          "Version : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Version mismatch: $($info.ProductVersion)" }

      # Linux builds carry no PE version resource and the .NET SDK appends +<sha> to
      # InformationalVersion, so the Windows ProductVersion prefix check has no Linux
      # equivalent. Verify the artefact is an ELF executable of the right architecture,
      # then actually run the headless daemon on x64: a binary whose native libraries fail to
      # resolve exits immediately, while a healthy one is still running when timeout kills it,
      # which is exit code 124.
      #
      # Two traps this step has to survive. GitHub's `bash` shell runs with -e, so the expected
      # 124 from timeout would abort the script before it could be inspected - the call is
      # therefore written to capture the code instead of failing. And an aarch64 binary cannot
      # run on an x64 runner at all, so the run check is x64-only; arm64 is verified by the
      # ELF/architecture check above, which is all a cross-published binary can prove here.
      - name: Smoke check the published binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          exe="publish/${{ matrix.rid }}/DeziroJoy"
          test -x "$exe" || { echo "not executable: $exe"; exit 1; }
          case "${{ matrix.rid }}" in
            linux-x64)   want="x86-64" ;;
            linux-arm64) want="aarch64" ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          got=$(file -b "$exe")
          echo "file: $got"
          echo "$got" | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          echo "$got" | grep -q "$want" || { echo "wrong architecture, wanted $want"; exit 1; }
          if [ "${{ matrix.rid }}" != "linux-x64" ]; then
            echo "cross-compiled for $want, run check needs that architecture - skipped"
            exit 0
          fi
          timeout 10 "$exe" --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

      # Inno Setup 6 ships on the windows-latest image. The script is driven entirely
      # by ISCC /D defines, so the step only passes the version, the RID and the two
      # absolute paths. The script itself resolves everything from its own location,
      # so the call works from any working directory. For win-x64 it also runs the
      # silent install / verify / uninstall cycle against a throwaway directory. A
      # win-arm64 setup.exe is the same x86 bootstrap Inno Setup always emits - the
      # loader is architecture-neutral whatever the payload is (verified 0x014C on
      # both Windows RIDs in beta.1 run 42670117262), so it would execute on the x64
      # runner - but its ArchitecturesAllowed=arm64 refuses to install there and the
      # ARM64 payload cannot execute, so that RID gets the compile and the PE
      # architecture checks only (the same cross-compilation convention the binary
      # smoke step above uses for linux-arm64).
      - name: Build and verify the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& '${{ github.workspace }}/tools/Packaging/win/build-and-verify.ps1' -Version '${{ steps.version.outputs.version }}' -Rid '${{ matrix.rid }}' -PublishDir '${{ github.workspace }}/publish/${{ matrix.rid }}'"

      # dpkg-deb from the ubuntu-latest image builds the package. The payload contract
      # (complete /opt/dezirojoy, the icon, the desktop entry, and nothing under /etc)
      # is asserted by the validation step below, and the install / smoke / remove
      # step proves it end to end on x64.
      - name: Build the .deb (dpkg-deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=amd64 ;;
            linux-arm64) arch=arm64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          tools/Packaging/linux/build-deb.sh "$version" '${{ matrix.rid }}' "publish/${{ matrix.rid }}" .
          test -s "DeziroJoy_${version}_${arch}.deb" || { echo "no deb produced"; exit 1; }

      # dpkg-deb --field is used instead of parsing --info output: --info indents the
      # control fields with a leading space, which exact line matching trips over.
      - name: Validate the .deb metadata and payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=amd64 ;;
            linux-arm64) arch=arm64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          deb="DeziroJoy_${version}_${arch}.deb"

          [ "$(dpkg-deb --field "$deb" Package)" = dezirojoy ] || { echo "wrong package name"; exit 1; }
          [ "$(dpkg-deb --field "$deb" Version)" = "$version" ] || { echo "wrong version"; exit 1; }
          [ "$(dpkg-deb --field "$deb" Architecture)" = "$arch" ] || { echo "wrong architecture"; exit 1; }
          dpkg-deb --field "$deb" Depends | grep -q . || { echo "no Depends line"; exit 1; }
          # DeziroJoy runs without InvariantGlobalization, so the .NET runtime
          # FailFasts at startup when no system ICU is present. The runner always has
          # one installed, so only this assertion keeps the list honest.
          dpkg-deb --field "$deb" Depends | grep -Eq 'libicu[0-9]+' \
            || { echo "Depends must include a versioned libicu alternative"; exit 1; }

          contents="$(dpkg-deb --contents "$deb")"
          for required in \
            "./opt/dezirojoy/DeziroJoy" \
            "./opt/dezirojoy/dezirojoy.ico" \
            "./usr/share/applications/dezirojoy.desktop"
          do
            echo "$contents" | grep -q " ${required}$" || { echo "missing from package: $required"; exit 1; }
          done
          # The payload must stay the complete publish output, not a trimmed subset.
          # +1 for the icon the build script adds, +1 for the /opt/dezirojoy directory
          # entry itself, which dpkg-deb --contents lists alongside the files.
          count="$(echo "$contents" | grep -c ' \./opt/dezirojoy/')"
          expected="$(find "publish/${{ matrix.rid }}" -type f | wc -l)"
          [ "$count" -ge $((expected + 2)) ] || { echo "only $count payload entries for $expected publish files"; exit 1; }
          # The installer must not ship anything under /etc: no systemd units, no cron
          # jobs, no udev rules. Autostart and the elevated daemon stay opt-in features
          # of the app itself.
          if echo "$contents" | grep -E ' \./etc/'; then
            echo "installer must not ship anything under /etc"
            exit 1
          fi
          # And no maintainer scripts: install and removal must stay side-effect free.
          ctrldir="$(mktemp -d)"
          dpkg-deb --control "$deb" "$ctrldir"
          if ls "$ctrldir" | grep -E '^(preinst|postinst|prerm|postrm)$'; then
            echo "installer must not ship maintainer scripts"
            exit 1
          fi

      # The x64 runner can install and run the amd64 package. apt resolves the Depends
      # line against the archive, which also proves every declared dependency exists;
      # the daemon is then smoked from the installed location, and removal must leave
      # nothing behind. linux-arm64 is cross-compiled and cannot run on this runner,
      # so it is covered by the static checks above - the same convention the binary
      # smoke step already uses for cross-published builds.
      - name: Install, smoke and remove the .deb
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          deb="DeziroJoy_${version}_amd64.deb"

          sudo apt-get update
          sudo apt-get install -y "./$deb"

          test -x /opt/dezirojoy/DeziroJoy || { echo "missing /opt/dezirojoy/DeziroJoy"; exit 1; }
          test -f /opt/dezirojoy/dezirojoy.ico || { echo "missing /opt/dezirojoy/dezirojoy.ico"; exit 1; }
          test -f /usr/share/applications/dezirojoy.desktop || { echo "missing desktop entry"; exit 1; }
          grep -q '^Exec=/opt/dezirojoy/DeziroJoy$' /usr/share/applications/dezirojoy.desktop \
            || { echo "desktop entry does not launch the installed binary"; exit 1; }

          # The daemon loads no GUI stack, but a binary whose native dependencies fail
          # to resolve still exits immediately, while a healthy one is still running
          # when timeout kills it, which is exit code 124. Run from the installed
          # location rather than the publish directory, and capture the code instead
          # of letting -e abort on the expected timeout.
          timeout 10 /opt/dezirojoy/DeziroJoy --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

          sudo dpkg -r dezirojoy
          test ! -e /opt/dezirojoy || { echo "/opt/dezirojoy still present after removal"; exit 1; }
          test ! -e /usr/share/applications/dezirojoy.desktop || { echo "desktop entry still present after removal"; exit 1; }
          if dpkg -s dezirojoy >/dev/null 2>&1; then
            echo "package still registered after removal"
            exit 1
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          rid='${{ matrix.rid }}'
          case "$rid" in
            win-x64|win-arm64)
              artifact="DeziroJoy-${version}-${rid}-setup.exe" ;;
            linux-x64)   artifact="DeziroJoy_${version}_amd64.deb" ;;
            linux-arm64) artifact="DeziroJoy_${version}_arm64.deb" ;;
            *) echo "unknown rid $rid"; exit 1 ;;
          esac
          test -s "$artifact" || { echo "artifact missing: $artifact"; exit 1; }
          sha256sum "$artifact" > "${artifact}.sha256"
          ls -la "$artifact" "${artifact}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            DeziroJoy-*-setup.exe
            DeziroJoy-*-setup.exe.sha256
            DeziroJoy_*.deb
            DeziroJoy_*.deb.sha256
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > body.md <<'NOTES'
          ## DeziroJoy vVERSION (beta preview)

          本版 Windows 安装器提供简体中文界面（英文回退）；复杂快捷键改为独立的
          长按手势动作，单击/双击不再被吞；Leader 键与精准键整套配置改为跨预设
          设备级共享；另有 Leader 单击切换预设、Guide/Back/Start 点击区域、实时
          预览摇杆与 LT/RT 扳机读取等多处稳定性修复。正式安装包沿用 Windows
          per-user 安装器（setup.exe）与 Linux .deb，安装与卸载都走系统标准途径。
          仍属 beta 预览版，欢迎按
          [QA 清单](docs/QA-CHECKLIST.md) 测试并反馈问题。

          ### 本版更新

          - **安装器简体中文界面**：Windows 安装器此前只加载英文语言文件，整个
            向导是英文界面。现在 [Languages] 增加 Inno Setup 自带的简体中文语言
            文件（`compiler:Languages\ChineseSimplified.isl`，LanguageID
            $0804），不引入外部翻译文件：欢迎、目录、任务（含桌面图标）、准备
            安装、完成与卸载等标准页面随语言文件本地化，自定义文案（桌面图标
            任务、「安装后运行」）改经语言文件的消息键引用而非硬编码英文。多语言
            时安装程序显示语言选择对话框并按系统语言预选，English 保留为回退。
            安装包文件名、版本、安装路径均未变
          - **复杂快捷键改为独立的长按手势动作**：beta.2 引入的复杂快捷键（长按
            期间按序执行、松手全部释放的手写 DSL 程序）此前被绑成映射自身的目标
            加一次裸长按，快速单击因此不触发，右侧列表的单击行也显示程序。现在
            程序只作为长按手势的动作存在：阈值前松手仍然触发单击，快速双击照常
            触发双击，单击、双击、复杂长按三者互不覆盖、各自独立配置。旧版 v1
            形状（程序即目标）的配置由引擎在构建时自动规范化——程序移到长按
            动作、单击目标改写为无功能，无需手动迁移。仍然被拒绝的只剩真正会让
            长按无法触发程序的组合：无长按阈值、单击重复、长按重复间隔；程序
            运行期间长按不可关闭。「复杂快捷键」类型只出现在长按页签；脚本编辑区
            维持实时解析、中文行/列报错与白话动作摘要，无法解析的脚本在「确定」
            处被拦截，不会写入活动配置
          - **特殊键显示为「Leader 键 / 精准键」**：映射行此前对特殊键目标没有
            描述分支，回退显示内部记录的调试输出。现在映射行、编辑器标题等所有
            描述路径统一显示「Leader 键」「精准键」，与编辑器选择器的命名一致，
            不再泄露内部类型
          - **Leader/精准键跨预设设备级共享**：Leader 键与精准键（映射自身目标
            或手势动作）整套配置改为设备级共享——在一处预设里增、删、改，该设备
            的所有预设同步更新；普通映射与精准缩放倍率仍按预设独立。共享特殊键
            占据某个位置时取代该位置原有内容（含该位置上的复杂快捷键程序），没有
            键声明的位置程序原样保留；同一来源同一位置上两个槽位放了不同种类的
            特殊键时较早槽位胜出。旧配置（各预设各自持有）在首次使用与重连时
            自动收敛：槽位 1 优先，仅后置槽位持有的特殊键合并保留；新增预设复制
            活动配置时一并带入共享子集，删除预设的 Leader 引用修复照旧重写所有
            存活槽。同时修复共享键落到旧 v1 复杂快捷键位置时，会把引擎拒绝的
            形状持久化、导致该预设切换不过去并在重连时报错的问题
          - **鼠标灵敏度面板的精准模式改为只读**：精准触发方式（一直按住才触发 /
            按一下启用，再按一下取消）属于按键映射，灵敏度面板改为只读文本加
            「映射界面设置」提示，与精准键的呈现一致，修改入口统一在按键映射；
            载入 / 应用灵敏度时该值双向携带，不会被重置
          - **Leader 单击切换预设稳定化**：Leader 键切换预设原先生效方式为重建
            设备引擎，而订阅者在发出切换命令的同一 tick 末尾同步重建；下一个 tick
            时键仍按住，新引擎以空边沿基线看到新的按下沿又切一次——落点取决于
            按住期间经过的 tick 数奇偶，单击有时切不过去、有时切两次，链式
            Leader 每按多走一格，Hold 模式还会丢掉释放沿、回不到主预设。现在
            新引擎采用设备最近一次轮询快照作为边沿基线：按住中的键不再形成假
            按下沿，真实释放仍形成释放沿；未被重载的其他运行槽的 Leader 闭锁
            重新锚定，已在目标槽的运行槽不再无谓重载
          - **Guide/Back/Start 中心组布局分离**：Guide 井与 Guide 点击区域此前
            压在 Back 胶囊右缘上，点 Back 右侧会被 Guide 抢走（实测 GuideWell
            覆盖 Back 约 41%）。现在按模型轴重新布局：Guide 居中，Back/Start
            等距分居两侧，各可见表面与 Guide 底板之间留出间隙，每个点击区域只
            覆盖自己的元素，显示与点击不再重叠
          - **实时预览摇杆迟滞与平滑**：实时预览此前用单一硬径向死区，幅值在
            阈值线附近抖动会让摇杆帽闪烁。现在改为迟滞门（进入 0.15 / 退出
            0.10）加短时常数 EMA 平滑：推过 0.15 立即进入并跳到目标偏转（首推
            即响应），幅值回落不到 0.10 保持进入态、不再反复弹回；进入期间滤除
            传感器噪声、释放时平滑滑回中心；位置与幅值读取同一滤波帧，亮度不再
            与帽位错步闪烁。只影响可视化器，不改映射、导航、注入与共享死区数学
            的任何阈值
          - **LT/RT 扳机施密特迟滞**：扳机读取加入施密特触发——按下阈值
            ≥140/255、释放阈值 ≤115/255，阈值带内保持原状态，中点噪声（如
            126/128）不再抖动按下标志。映射引擎是边沿驱动，此前的抖动会以最高
            500Hz 注入成对的按下 / 释放，现在一次真实扣扳机只产生一次按下 /
            释放对，持续按住不再闪烁。evdev 与 XInput 阈值一致，均按设备独立
            （多手柄交错轮询互不重置）；LB/RB 是数字键，不走该路径

          ### 下载

          | 文件 | 平台 | 说明 |
          | --- | --- | --- |
          | `DeziroJoy-PACKAGEVERSION-win-x64-setup.exe` | Windows | 自包含安装包，双击即装（无需安装 .NET），per-user 装到 `%LOCALAPPDATA%\Programs\DeziroJoy`，Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-win-arm64-setup.exe` | Windows | 同上，ARM64（如骁龙笔记本） |
          | `DeziroJoy_PACKAGEVERSION_amd64.deb` | Linux | 自包含 deb，`sudo apt install` 装到 `/opt/dezirojoy` 并注册应用菜单入口，Intel / AMD 64 位 |
          | `DeziroJoy_PACKAGEVERSION_arm64.deb` | Linux | 同上，ARM64（如树莓派） |
          | `*.sha256` | — | SHA256 校验和 |

          Windows 安装器为 per-user 模式，不需要管理员权限；两个平台的安装器都不注册
          自启动、计划任务或 udev 规则（登录自启动与提权常驻服务请在应用内「设置」中
          按需开启），卸载也不会删除用户配置。卸载方式：Windows 用「设置 → 应用」或
          安装目录中的 `unins000.exe`，Linux 用 `sudo dpkg -r dezirojoy`。Linux 安装请用
          `sudo apt install ./DeziroJoy_PACKAGEVERSION_amd64.deb`（arm64 替换文件名）
          而非 `dpkg -i`：依赖（X11、fontconfig、ICU 等）会一并解析，`dpkg -i` 不会。

          安装器未做代码签名。Windows 上首次运行未签名的 setup.exe 可能弹出
          SmartScreen「Windows 已保护你的电脑」提示，属预期行为：选择「更多信息 →
          仍要运行」即可继续安装。

          Linux 版需要系统提供 X11 / Wayland 客户端库（`libX11`、`libxcb` 等，
          桌面发行版默认齐全）与 `evdev` / `uinput` 内核模块。读取手柄只需要
          `evdev`；注入鼠标键盘需要 `/dev/uinput` 可写，若不可写应用会明确报告，
          不会静默失效。

          ### 已知限制

          - Windows 上输入读取走 XInput，只能看到 Xbox 布局的标准按键；
            超出该布局的按键（部分第三方手柄的额外宏键）不会被识别。
          - XInput 无法提供稳定硬件 ID，Windows 上配置按 XInput 槽位（#1-#4）
            保存；两个手柄互换插槽时，配置随槽位而非硬件走。Linux 上 evdev
            提供稳定设备路径，按硬件保存。
          - 常驻服务使用 Windows 计划任务的「登录时」触发器，而非开机启动：
            登录前进程运行在会话 0，无法向用户桌面注入输入。
          - Windows 上 SendInput 受 UIPI 约束：非提权进程无法向提权目标注入
            输入，且失败时错误码不指明源于 UIPI。请使用提权常驻服务。

