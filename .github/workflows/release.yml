name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Windows packaging script derives every path from its own location
      # ($PSScriptRoot), and this workflow is its only caller. Recompute that
      # derivation here on every leg: a walk one level short lands on tools/ and
      # each joined path gains a spurious tools\ segment - the beta.1 run failed
      # with ...\tools\tools\Packaging\win\DeziroJoy.iss on both Windows RIDs.
      # The check is static, so it needs no toolchain and runs on any runner.
      - name: Verify packaging path derivation (static)
        shell: bash
        run: |
          set -euo pipefail
          script='tools/Packaging/win/build-and-verify.ps1'
          test -f "$script" || { echo "missing $script"; exit 1; }

          # tools/Packaging/win is the script's own directory; the repository
          # root derivation must walk exactly back to the repository root.
          walk="$(grep -oP "\\\$repoRoot = .*Join-Path \\\$PSScriptRoot '\K[^']*" "$script" || true)"
          if [ -z "$walk" ]; then
            echo "no repository root derivation found in $script"
            exit 1
          fi
          resolved='tools/Packaging/win'
          IFS='/' read -r -a segments <<< "$walk"
          for segment in "${segments[@]}"; do
            if [ "$segment" != '..' ]; then
              echo "unexpected segment '$segment' in repository root derivation"
              exit 1
            fi
            resolved="$(dirname "$resolved")"
          done
          if [ "$resolved" != '.' ]; then
            echo "repository root derives to '$resolved', expected the repository root"
            exit 1
          fi

          # Every repository-relative path the script joins onto that root must
          # exist, or the Windows runner fails mid-build with a missing file.
          while read -r rel; do
            if [ ! -e "$rel" ]; then
              echo "path referenced by $script missing from the repository: $rel"
              exit 1
            fi
          done < <(grep -oP "Join-Path \\\$repoRoot '\K[^']*" "$script" || true)

      # The Windows installer ships a Simplified Chinese interface built from the
      # repository's own ChineseSimplified.isl - Inno Setup's official translation
      # (since 6.5.0, unchanged for 6.7.1), referenced as
      # Languages\ChineseSimplified.isl relative to the .iss, so the build no
      # longer depends on the runner's Inno install carrying that language file -
      # with English kept as the fallback (M30). Both languages are declared in
      # the .iss [Languages] section, and the wizard's custom texts - the
      # desktop-icon task and the launch-after-install entry - must be referenced
      # through the language files ({cm:...}): a hard-coded English string there
      # would stay English on a Chinese install. This is a static grep, so it
      # needs no Inno install and fails before the publish instead of at the
      # compile; build-and-verify.ps1 additionally checks that the repository's
      # Languages\ChineseSimplified.isl exists and defines its message keys.
      - name: Verify installer localization (static)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          iss='tools/Packaging/win/DeziroJoy.iss'
          test -f "$iss" || { echo "missing $iss"; exit 1; }

          grep -Pq '^\s*Name:\s*"english"\s*;\s*MessagesFile:\s*"compiler:Default\.isl"\s*$' "$iss" \
            || { echo "$iss must keep English (compiler:Default.isl) as the fallback language"; exit 1; }
          grep -Pq '^\s*Name:\s*"chinesesimplified"\s*;\s*MessagesFile:\s*"Languages\\ChineseSimplified\.isl"\s*$' "$iss" \
            || { echo "$iss must declare Simplified Chinese (Languages\ChineseSimplified.isl)"; exit 1; }
          grep -Pq '^\s*Name:\s*"desktopicon"\s*;\s*Description:\s*"\{cm:CreateDesktopIcon\}"' "$iss" \
            || { echo "the desktopicon task must be localized through {cm:CreateDesktopIcon}"; exit 1; }
          grep -Pq 'Description:\s*"\{cm:LaunchProgram,\{#MyAppName\}\}"' "$iss" \
            || { echo "the launch-after-install entry must be localized through {cm:LaunchProgram,...}"; exit 1; }
          echo "installer localization declared: english (fallback) + chinesesimplified, custom texts via {cm:...}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained build
        run: >
          dotnet publish src/DeziroJoy.App
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Smoke check the published binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/DeziroJoy.exe"
          if (-not (Test-Path $exe)) { throw "DeziroJoy.exe missing from publish output" }
          $info = (Get-Item $exe).VersionInfo
          "Product : $($info.ProductName)"
          "Version : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Version mismatch: $($info.ProductVersion)" }

      # Linux builds carry no PE version resource and the .NET SDK appends +<sha> to
      # InformationalVersion, so the Windows ProductVersion prefix check has no Linux
      # equivalent. Verify the artefact is an ELF executable of the right architecture,
      # then actually run the headless daemon on x64: a binary whose native libraries fail to
      # resolve exits immediately, while a healthy one is still running when timeout kills it,
      # which is exit code 124.
      #
      # Two traps this step has to survive. GitHub's `bash` shell runs with -e, so the expected
      # 124 from timeout would abort the script before it could be inspected - the call is
      # therefore written to capture the code instead of failing. And an aarch64 binary cannot
      # run on an x64 runner at all, so the run check is x64-only; arm64 is verified by the
      # ELF/architecture check above, which is all a cross-published binary can prove here.
      - name: Smoke check the published binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          exe="publish/${{ matrix.rid }}/DeziroJoy"
          test -x "$exe" || { echo "not executable: $exe"; exit 1; }
          case "${{ matrix.rid }}" in
            linux-x64)   want="x86-64" ;;
            linux-arm64) want="aarch64" ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          got=$(file -b "$exe")
          echo "file: $got"
          echo "$got" | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          echo "$got" | grep -q "$want" || { echo "wrong architecture, wanted $want"; exit 1; }
          if [ "${{ matrix.rid }}" != "linux-x64" ]; then
            echo "cross-compiled for $want, run check needs that architecture - skipped"
            exit 0
          fi
          timeout 10 "$exe" --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

      # Inno Setup 6 ships on the windows-latest image. The script is driven entirely
      # by ISCC /D defines, so the step only passes the version, the RID and the two
      # absolute paths. The script itself resolves everything from its own location,
      # so the call works from any working directory. The script compiles the published
      # setup.exe WITH /DDeziroJoyUpdateRun (carrying the in-app updater's relaunch
      # entry) and, for win-x64, a SECOND define-free setup that the silent install /
      # verify / uninstall cycle runs against in a throwaway directory - the loop must
      # never relaunch the app, so it installs the build without the update-run entry. A
      # win-arm64 setup.exe is the same x86 bootstrap Inno Setup always emits - the
      # loader is architecture-neutral whatever the payload is (verified 0x014C on
      # both Windows RIDs in beta.1 run 42670117262), so it would execute on the x64
      # runner - but its ArchitecturesAllowed=arm64 refuses to install there and the
      # ARM64 payload cannot execute, so that RID gets the compile and the PE
      # architecture checks only (the same cross-compilation convention the binary
      # smoke step above uses for linux-arm64).
      - name: Build and verify the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& '${{ github.workspace }}/tools/Packaging/win/build-and-verify.ps1' -Version '${{ steps.version.outputs.version }}' -Rid '${{ matrix.rid }}' -PublishDir '${{ github.workspace }}/publish/${{ matrix.rid }}'"

      # dpkg-deb from the ubuntu-latest image builds the package. The payload contract
      # (complete /opt/dezirojoy, the icon, the desktop entry, and nothing under /etc)
      # is asserted by the validation step below, and the install / smoke / remove
      # step proves it end to end on x64.
      - name: Build the .deb (dpkg-deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=amd64 ;;
            linux-arm64) arch=arm64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          tools/Packaging/linux/build-deb.sh "$version" '${{ matrix.rid }}' "publish/${{ matrix.rid }}" .
          test -s "DeziroJoy_${version}_${arch}.deb" || { echo "no deb produced"; exit 1; }

      # dpkg-deb --field is used instead of parsing --info output: --info indents the
      # control fields with a leading space, which exact line matching trips over.
      - name: Validate the .deb metadata and payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=amd64 ;;
            linux-arm64) arch=arm64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          deb="DeziroJoy_${version}_${arch}.deb"

          [ "$(dpkg-deb --field "$deb" Package)" = dezirojoy ] || { echo "wrong package name"; exit 1; }
          [ "$(dpkg-deb --field "$deb" Version)" = "$version" ] || { echo "wrong version"; exit 1; }
          [ "$(dpkg-deb --field "$deb" Architecture)" = "$arch" ] || { echo "wrong architecture"; exit 1; }
          dpkg-deb --field "$deb" Depends | grep -q . || { echo "no Depends line"; exit 1; }
          # DeziroJoy runs without InvariantGlobalization, so the .NET runtime
          # FailFasts at startup when no system ICU is present. The runner always has
          # one installed, so only this assertion keeps the list honest.
          dpkg-deb --field "$deb" Depends | grep -Eq 'libicu[0-9]+' \
            || { echo "Depends must include a versioned libicu alternative"; exit 1; }

          contents="$(dpkg-deb --contents "$deb")"
          for required in \
            "./opt/dezirojoy/DeziroJoy" \
            "./opt/dezirojoy/dezirojoy.ico" \
            "./usr/share/applications/dezirojoy.desktop"
          do
            echo "$contents" | grep -q " ${required}$" || { echo "missing from package: $required"; exit 1; }
          done
          # The payload must stay the complete publish output, not a trimmed subset.
          # +1 for the icon the build script adds, +1 for the /opt/dezirojoy directory
          # entry itself, which dpkg-deb --contents lists alongside the files.
          count="$(echo "$contents" | grep -c ' \./opt/dezirojoy/')"
          expected="$(find "publish/${{ matrix.rid }}" -type f | wc -l)"
          [ "$count" -ge $((expected + 2)) ] || { echo "only $count payload entries for $expected publish files"; exit 1; }
          # The installer must not ship anything under /etc: no systemd units, no cron
          # jobs, no udev rules. Autostart and the elevated daemon stay opt-in features
          # of the app itself.
          if echo "$contents" | grep -E ' \./etc/'; then
            echo "installer must not ship anything under /etc"
            exit 1
          fi
          # And no maintainer scripts: install and removal must stay side-effect free.
          ctrldir="$(mktemp -d)"
          dpkg-deb --control "$deb" "$ctrldir"
          if ls "$ctrldir" | grep -E '^(preinst|postinst|prerm|postrm)$'; then
            echo "installer must not ship maintainer scripts"
            exit 1
          fi

      # The x64 runner can install and run the amd64 package. apt resolves the Depends
      # line against the archive, which also proves every declared dependency exists;
      # the daemon is then smoked from the installed location, and removal must leave
      # nothing behind. linux-arm64 is cross-compiled and cannot run on this runner,
      # so it is covered by the static checks above - the same convention the binary
      # smoke step already uses for cross-published builds.
      - name: Install, smoke and remove the .deb
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          deb="DeziroJoy_${version}_amd64.deb"

          sudo apt-get update
          sudo apt-get install -y "./$deb"

          test -x /opt/dezirojoy/DeziroJoy || { echo "missing /opt/dezirojoy/DeziroJoy"; exit 1; }
          test -f /opt/dezirojoy/dezirojoy.ico || { echo "missing /opt/dezirojoy/dezirojoy.ico"; exit 1; }
          test -f /usr/share/applications/dezirojoy.desktop || { echo "missing desktop entry"; exit 1; }
          grep -q '^Exec=/opt/dezirojoy/DeziroJoy$' /usr/share/applications/dezirojoy.desktop \
            || { echo "desktop entry does not launch the installed binary"; exit 1; }

          # The daemon loads no GUI stack, but a binary whose native dependencies fail
          # to resolve still exits immediately, while a healthy one is still running
          # when timeout kills it, which is exit code 124. Run from the installed
          # location rather than the publish directory, and capture the code instead
          # of letting -e abort on the expected timeout.
          timeout 10 /opt/dezirojoy/DeziroJoy --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

          sudo dpkg -r dezirojoy
          test ! -e /opt/dezirojoy || { echo "/opt/dezirojoy still present after removal"; exit 1; }
          test ! -e /usr/share/applications/dezirojoy.desktop || { echo "desktop entry still present after removal"; exit 1; }
          if dpkg -s dezirojoy >/dev/null 2>&1; then
            echo "package still registered after removal"
            exit 1
          fi

      # rpmbuild from the Ubuntu image (universe) builds the package; cpio and
      # rpm2cpio are what the payload assertion below unpacks it with
      # (rpm2cpio is its own package on Debian/Ubuntu, not part of rpm). The
      # script stages the payload and drives rpmbuild itself and resolves the
      # repository files from its own location, so the step passes the same
      # four arguments as the .deb step: version, RID, publish directory,
      # output directory. The RPM Version field forbids '-' (it separates
      # version from release), so the script rewrites '-' to '~' internally
      # and keeps the original semver only in the asset name:
      # DeziroJoy-<ver>-<arch>.rpm.
      - name: Build the .rpm (rpmbuild)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=x86_64 ;;
            linux-arm64) arch=aarch64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y rpm cpio rpm2cpio
          tools/Packaging/linux/rpm/build-rpm.sh "$version" '${{ matrix.rid }}' "publish/${{ matrix.rid }}" .
          test -s "DeziroJoy-${version}-${arch}.rpm" || { echo "no rpm produced"; exit 1; }

      # rpm -qp queries the built package without installing it - the Ubuntu
      # runner cannot install a .rpm at all, which is why this contract is
      # asserted statically, the same way the .deb leg's metadata and payload
      # are. The assertions mirror that step one for one: name, version,
      # architecture, a non-empty Requires carrying ICU (the .NET runtime
      # dlopens it instead of linking it, so rpmbuild's find-requires cannot
      # see it and the spec pins the soname range explicitly), no scriptlets,
      # and a payload that is the complete publish output plus the icon, the
      # fix helper, the desktop entry and the hicolor theme - and nothing
      # under /etc. The version comparison runs against the '~' form the
      # build produces: RPM forbids '-' in Version, and '~' sorts below every
      # other character, which reproduces semver prerelease ordering
      # (0.0.1~beta.5~preview < 0.0.1) for free.
      - name: Validate the .rpm metadata and payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=x86_64 ;;
            linux-arm64) arch=aarch64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          rpm_file="DeziroJoy-${version}-${arch}.rpm"
          # The '~' sanitisation build-rpm.sh applies to Version.
          rpm_version="${version//-/\~}"

          [ "$(rpm -qp --qf '%{NAME}' "$rpm_file")" = dezirojoy ] || { echo "wrong package name"; exit 1; }
          [ "$(rpm -qp --qf '%{VERSION}' "$rpm_file")" = "$rpm_version" ] || { echo "wrong version, expected $rpm_version"; exit 1; }
          [ "$(rpm -qp --qf '%{ARCH}' "$rpm_file")" = "$arch" ] || { echo "wrong architecture"; exit 1; }
          rpm -qp --requires "$rpm_file" | grep -q . || { echo "no Requires line"; exit 1; }
          # The one dependency find-requires cannot generate. Without this
          # assertion a spec edit could drop it and the package would install
          # cleanly, then FailFast at startup on a minimal system.
          rpm -qp --requires "$rpm_file" | grep -Eq 'libicu(uc|i18n)\.so' \
            || { echo "Requires must include an ICU soname"; exit 1; }
          # No scriptlets: install and removal stay side-effect free, exactly
          # like the .deb's missing maintainer scripts.
          if [ -n "$(rpm -qp --scripts "$rpm_file")" ]; then
            echo "package must not ship scriptlets"
            rpm -qp --scripts "$rpm_file"
            exit 1
          fi

          # rpm2cpio | cpio -t lists the payload without installing the
          # package; a leading ./ is normalised away so the names below are
          # the paths as installed.
          contents="$(rpm2cpio "$rpm_file" | cpio -t | sed 's|^\./||')"
          for required in \
            "opt/dezirojoy/DeziroJoy" \
            "opt/dezirojoy/dezirojoy.ico" \
            "opt/dezirojoy/fix-device-access.sh" \
            "usr/share/applications/dezirojoy.desktop"
          do
            echo "$contents" | grep -qx "$required" || { echo "missing from package: $required"; exit 1; }
          done
          for size in 16 24 32 48 64 128 256; do
            icon="usr/share/icons/hicolor/${size}x${size}/apps/dezirojoy.png"
            echo "$contents" | grep -qx "$icon" || { echo "missing from package: $icon"; exit 1; }
          done
          # The payload must stay the complete publish output, not a trimmed
          # subset: +1 for the icon the build adds, +1 for the fix helper.
          # cpio -t prints bare names, so the pattern carries no ls -l-style
          # leading space the way the .deb's dpkg-deb --contents one does.
          count="$(echo "$contents" | grep -c 'opt/dezirojoy/')"
          expected="$(find "publish/${{ matrix.rid }}" -type f | wc -l)"
          [ "$count" -ge $((expected + 2)) ] || { echo "only $count payload entries for $expected publish files"; exit 1; }
          # Nothing under /etc: no systemd units, no cron jobs, no udev rules.
          # Autostart and the elevated daemon stay opt-in features of the app.
          if echo "$contents" | grep -Eq '^etc(/|$)'; then
            echo "package must not ship anything under /etc"
            exit 1
          fi

      # appimagetool is downloaded by the script itself (the continuous build,
      # invoked with --appimage-extract-and-run because the runner has no FUSE
      # to mount the type-2 tool), so the only dependency to install here is
      # desktop-file-validate: appimagetool refuses to start without it. The
      # script takes the same four arguments as the .deb and .rpm steps and
      # packs the publish output into DeziroJoy-<ver>-<arch>.AppImage. The tool
      # only packs the AppDir and never executes the payload, so the aarch64
      # leg cross-builds on the x64 runner exactly like the .deb and .rpm legs.
      - name: Build the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=x86_64 ;;
            linux-arm64) arch=aarch64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          tools/Packaging/linux/appimage/build-appimage.sh "$version" '${{ matrix.rid }}' "publish/${{ matrix.rid }}" .
          test -s "DeziroJoy-${version}-${arch}.AppImage" || { echo "no AppImage produced"; exit 1; }

      # The image is unpacked without FUSE and the extracted tree is asserted
      # statically: AppRun, the desktop entry, the root icon appimagetool links
      # as .DirIcon, and an ELF binary of the right architecture. Unpacking is
      # per-architecture: linux-x64 asks its own type-2 runtime with
      # --appimage-extract, while linux-arm64 reads the squashfs payload out
      # with unsquashfs - the aarch64 runtime embedded in that image cannot
      # execute on this x64 runner (exit 126, "cannot execute binary file"),
      # which is the failure this split removes. There is deliberately no
      # hicolor tree inside the image - the icon travels as the root PNG and
      # nothing inside a squashfs consumes /usr/share/icons - so the seven
      # theme frames are asserted on the .deb and .rpm legs only. On linux-x64
      # the extracted AppRun then actually runs the daemon: a binary whose
      # native dependencies fail to resolve exits immediately, a healthy one is
      # still running when timeout kills it, which is exit code 124 - the same
      # smoke the .deb install step performs, run from the extracted tree
      # instead of an install location. linux-arm64 is cross-compiled and stays
      # static-only, the convention every leg above uses for a binary that
      # cannot execute on this runner.
      - name: Validate the AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          case '${{ matrix.rid }}' in
            linux-x64)   arch=x86_64;  want=x86-64 ;;
            linux-arm64) arch=aarch64; want=aarch64 ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          image="DeziroJoy-${version}-${arch}.AppImage"
          test -s "$image" || { echo "artifact missing: $image"; exit 1; }
          chmod +x "$image"

          # The type-2 runtime extracts into the current directory, so run it
          # from a scratch one and keep the tree out of the workspace.
          extract="$(mktemp -d)"
          root="$extract/squashfs-root"
          if [ "$arch" = "x86_64" ]; then
            # x64: the embedded runtime is native to this runner, so it
            # unpacks itself with --appimage-extract.
            (cd "$extract" && "$GITHUB_WORKSPACE/$image" --appimage-extract) > extract.log 2>&1
          else
            # arm64: the embedded runtime is aarch64 and cannot execute here,
            # so read the squashfs payload out of the image directly. The
            # superblock sits at an unaligned offset behind the runtime ELF,
            # which plain unsquashfs cannot find: locate the squashfs magic
            # ("hsqs") and pass the byte offset with -o. Every candidate is
            # tried in order - the magic is a 4-byte string, and a spurious hit
            # inside the runtime must not fail the step.
            command -v unsquashfs >/dev/null 2>&1 || sudo apt-get install -y squashfs-tools
            offsets="$(grep -abo hsqs "$image" | cut -d: -f1 || true)"
            offset=""
            for candidate in $offsets; do
              rm -rf "$root"
              if unsquashfs -o "$candidate" -d "$root" "$image" > extract.log 2>&1; then
                offset="$candidate"
                break
              fi
            done
            test -n "$offset" || { echo "no squashfs payload found in $image"; sed -n '1,5p' extract.log 2>/dev/null || true; exit 1; }
            echo "extracted squashfs payload at offset $offset"
          fi
          sed -n '1,10p' extract.log
          test -d "$root" || { echo "no squashfs-root extracted"; exit 1; }

          test -x "$root/AppRun" || { echo "AppRun missing from the image"; exit 1; }
          test -f "$root/dezirojoy.desktop" || { echo "desktop entry missing from the image"; exit 1; }
          test -f "$root/dezirojoy.png" || { echo "icon missing from the image"; exit 1; }
          for required in \
            "opt/dezirojoy/DeziroJoy" \
            "opt/dezirojoy/dezirojoy.ico" \
            "opt/dezirojoy/fix-device-access.sh"
          do
            test -f "$root/$required" || { echo "missing from image: $required"; exit 1; }
          done
          # The payload must stay the complete publish output, not a trimmed
          # subset: +1 for the icon the build adds, +1 for the fix helper.
          count="$(find "$root/opt/dezirojoy" -type f | wc -l)"
          expected="$(find "publish/${{ matrix.rid }}" -type f | wc -l)"
          [ "$count" -ge $((expected + 2)) ] || { echo "only $count payload files for $expected publish files"; exit 1; }

          got=$(file -b "$root/opt/dezirojoy/DeziroJoy")
          echo "file: $got"
          echo "$got" | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          echo "$got" | grep -q "$want" || { echo "wrong architecture, wanted $want"; exit 1; }
          if [ '${{ matrix.rid }}' != "linux-x64" ]; then
            echo "cross-compiled for $want, run check needs that architecture - skipped"
            exit 0
          fi
          timeout 10 "$root/AppRun" --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          rid='${{ matrix.rid }}'
          # Every asset gets its own sidecar checksum, so each leg enumerates
          # its list: the Windows legs keep their single setup.exe, while each
          # Linux leg now ships three formats - .deb, .rpm and AppImage.
          case "$rid" in
            win-x64|win-arm64)
              artifacts="DeziroJoy-${version}-${rid}-setup.exe" ;;
            linux-x64)
              artifacts="DeziroJoy_${version}_amd64.deb DeziroJoy-${version}-x86_64.rpm DeziroJoy-${version}-x86_64.AppImage" ;;
            linux-arm64)
              artifacts="DeziroJoy_${version}_arm64.deb DeziroJoy-${version}-aarch64.rpm DeziroJoy-${version}-aarch64.AppImage" ;;
            *) echo "unknown rid $rid"; exit 1 ;;
          esac
          for artifact in $artifacts; do
            test -s "$artifact" || { echo "artifact missing: $artifact"; exit 1; }
            sha256sum "$artifact" > "${artifact}.sha256"
            ls -la "$artifact" "${artifact}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            DeziroJoy-*-setup.exe
            DeziroJoy-*-setup.exe.sha256
            DeziroJoy_*.deb
            DeziroJoy_*.deb.sha256
            DeziroJoy-*.rpm
            DeziroJoy-*.rpm.sha256
            DeziroJoy-*.AppImage
            DeziroJoy-*.AppImage.sha256
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > body.md <<'NOTES'
          ## DeziroJoy vVERSION

          DeziroJoy 0.0.2-beta.1 预览版：把游戏手柄映射为鼠标与键盘的跨平台工具。
          Windows 走 XInput + SendInput（提权常驻守护进程作为唯一注入权威），Linux 走
          evdev + uinput（systemd 用户单元常驻），读取与注入都在内核级，与显示服务器
          无关。本版在 0.0.1 正式版（内置自动更新、deb / rpm / AppImage 与 Windows
          per-user 安装器）之上，集中修正四个影响连续操作可靠性的运行时问题，并新增
          Leader 临时层与不抢焦点的命令提示浮层。安装与卸载都走系统标准途径，安装器
          不注册自启动、计划任务或 udev 规则（登录自启动与常驻服务请在应用内「设置」
          中按需开启），卸载也不会删除用户配置。欢迎按
          [QA 清单](docs/QA-CHECKLIST.md) 测试并反馈问题。

          ### 本版更新

          #### 系列至今的关键能力（alpha → 0.0.1）

          - **手柄映射**：按键、摇杆、扳机、十字键映射到键盘按键、组合键、鼠标
            移动 / 点击 / 滚轮；死区、响应曲线（线性 / 精准 / 激进 / 灵敏）、平滑、
            最高速度（px/s，与 DPI、分辨率无关）与亚像素累积均可调，改动即时生效
          - **复杂快捷键 DSL**：长按可运行一段脚本，如「持续按住 Alt；每 1 秒点按
            Tab」（`hold Alt` + `every 1s tap Tab`）；实时行 / 列语法诊断与白话摘要，
            非法脚本被拦截且不污染活动映射
          - **预设管理**：每设备四个独立预设槽，整体级活动槽随切换持久化；Leader 键
            在引擎内切换预设槽，与 GUI 切换同一条逻辑
          - **Leader 精准键与全局特殊键**：Leader 键与精准键置顶到「按键配置」页并带
            实时冲突检测，只报引擎真实会出的问题，只提示、不自动改配置
          - **实时预览**：手柄可视化器实时反映按键与摇杆，灵敏度调整带实时预览点与
            响应曲线
          - **托盘常驻**：关闭窗口进托盘、映射继续；托盘菜单「显示主窗口 / 切换主题 /
            退出」
          - **跨平台注入**：Windows 上非提权进程受 UIPI 约束无法向提权目标注入，由
            提权常驻守护进程经命名管道作为唯一注入权威；Linux 上 uinput 不受 UIPI
            约束，守护进程以当前用户经 systemd 用户单元常驻，注入失败不再无声
          - **设备访问权诊断与一键修复**（Linux）：evdev 扫描区分无节点 / 无权限 /
            无手柄并给出可操作指引，「修复设备访问权限」一键安装 udev 规则并加入
            input 组，无 polkit 代理时降级为可复制命令

          #### 本批新增

          - **曲线强度限定 [0,1]**：强度大于 1 时旧公式会外推，导致轻推反向、幅度
            越界（如激进曲线 m=0.25、强度 2 输出 −0.125）。界面滑块、导入配置与引擎
            一致把强度限制在 [0,1]，该范围内混合曲线单调且值域不越界；旧配置导入自动
            归一，既有预设（强度 1）不受影响
          - **输出所有权表**：按键 / 修饰键 / 鼠标键按持有者（映射 / 宏实例 / 设备）
            引用计数，第一个持有者按下、最后一个释放才抬起，取消 / 断连只撤销对应
            持有者。修复 LB 按住 Ctrl 时 X 组合键结束误抬 Ctrl、两宏共享 Ctrl、两映射
            共享鼠标左键、两手柄输出同一按键互抢；修饰键与普通键同组
          - **采样间断健壮性**：位移积分与动作计时分别限幅，周期补发设每 tick 预算，
            长间断后清理累计状态并重新采纳输入基线——鼠标不再大跳移、`every 50ms tap`
            不再集中补发上百次，正常小步长重复补齐仍不丢单位
          - **手势处理器生命周期**：Reset 保留手势鼠标处理器注册、只清状态，暂停 /
            恢复与 GUI 接管 / 归还后双击 / 长按→鼠标移动不再失效
          - **Leader 临时层**：按住 Layer 键进入只覆盖少数按钮的临时层，未覆盖映射
            继承基础层，相同持续动作跨层保持（RT 拖拽不因按住 RB 中断）；Leader 先于
            普通键解析，松开 / 断连 / 异常退出可靠释放；保留原有完整预设切换。编辑器
            可新建 Hold 型 Layer 键并把映射放入指定层
          - **不抢焦点命令提示浮层**：按住层 Leader 时屏幕边缘显示当前层按键的可读
            动作名（如「X：复制」），复用实时手柄图，不夺取目标应用键盘焦点；松开 /
            断连即消失

          ### 下载

          | 文件 | 平台 | 说明 |
          | --- | --- | --- |
          | `DeziroJoy-PACKAGEVERSION-win-x64-setup.exe` | Windows | 自包含安装包，双击即装（无需安装 .NET），per-user 装到 `%LOCALAPPDATA%\Programs\DeziroJoy`，Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-win-arm64-setup.exe` | Windows | 同上，ARM64（如骁龙笔记本） |
          | `DeziroJoy_PACKAGEVERSION_amd64.deb` | Linux | 自包含 deb，`sudo apt install` 装到 `/opt/dezirojoy` 并注册应用菜单入口，Intel / AMD 64 位 |
          | `DeziroJoy_PACKAGEVERSION_arm64.deb` | Linux | 同上，ARM64（如树莓派） |
          | `DeziroJoy-PACKAGEVERSION-x86_64.rpm` | Linux | 自包含 rpm，`sudo dnf install` 装到 `/opt/dezirojoy`，Fedora / RHEL / openSUSE 等，Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-aarch64.rpm` | Linux | 同上，ARM64（如树莓派） |
          | `DeziroJoy-PACKAGEVERSION-x86_64.AppImage` | Linux | 便携 AppImage，`chmod +x` 后直接运行，无需安装、不改动系统，Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-aarch64.AppImage` | Linux | 同上，ARM64 |
          | `*.sha256` | — | SHA256 校验和 |

          Windows 安装器为 per-user 模式，不需要管理员权限；所有平台的安装器都不注册
          自启动、计划任务或 udev 规则（登录自启动与常驻服务请在应用内「设置」中按需
          开启），卸载也不会删除用户配置。卸载方式：Windows 用「设置 → 应用」或安装
          目录中的 `unins000.exe`，Linux deb 用 `sudo dpkg -r dezirojoy`，rpm 用
          `sudo dnf remove dezirojoy`，AppImage 直接删除文件即可。

          Linux 各格式安装方式：

          - deb（Debian / Ubuntu）：`sudo apt install ./DeziroJoy_PACKAGEVERSION_amd64.deb`
            （arm64 替换文件名）而非 `dpkg -i`：依赖（X11、fontconfig、ICU 等）会一并
            解析，`dpkg -i` 不会。
          - rpm（Fedora / RHEL / openSUSE）：`sudo dnf install ./DeziroJoy-PACKAGEVERSION-x86_64.rpm`
            （aarch64 替换文件名）。
          - AppImage（任意发行版）：`chmod +x DeziroJoy-PACKAGEVERSION-x86_64.AppImage`
            后直接运行；三种 Linux 格式的 `/opt/dezirojoy` 载荷一致，只是容器不同。

          **关于 Flatpak**：本版暂不提供 Flatpak 包。DeziroJoy 的注入依赖对
          `/dev/uinput` 的写权限，而 Flatpak 沙箱默认不授予该权限，且当前桌面门户
          （xdg-desktop-portal）没有暴露 uinput 写入口——沙箱内注入功能在默认桌面上
          不可用。应用内的「一键修复设备访问权限」（pkexec + udev 规则）与 systemd
          用户单元常驻模型在沙箱内同样不成立（无法写 /etc、无法管理用户单元）。待
          libeis / 输入门户成熟后再评估接入；在此期间请使用 deb / rpm / AppImage。

          安装器未做代码签名。Windows 上首次运行未签名的 setup.exe 可能弹出
          SmartScreen「Windows 已保护你的电脑」提示，属预期行为：选择「更多信息 →
          仍要运行」即可继续安装。

          Linux 版需要系统提供 X11 / Wayland 客户端库（`libX11`、`libxcb` 等，桌面
          发行版默认齐全）与 `evdev` / `uinput` 内核模块。读取手柄只需要 `evdev`；注入
          鼠标键盘需要 `/dev/uinput` 可写，若不可写应用会明确报告，不会静默失效。

          ### 已知限制

          - Windows 上输入读取走 XInput，只能看到 Xbox 布局的标准按键；
            超出该布局的按键（部分第三方手柄的额外宏键）不会被识别。
          - XInput 无法提供稳定硬件 ID，Windows 上配置按 XInput 槽位（#1-#4）
            保存；两个手柄互换插槽时，配置随槽位而非硬件走。Linux 上 evdev
            提供稳定设备路径，按硬件保存。
          - 常驻服务使用 Windows 计划任务的「登录时」触发器，而非开机启动：
            登录前进程运行在会话 0，无法向用户桌面注入输入。
          - Windows 上 SendInput 受 UIPI 约束：非提权进程无法向提权目标注入
            输入，且失败时错误码不指明源于 UIPI。请使用提权常驻服务。
          - 精准键只有设在单击位才生效：设在双击 / 长按手势上时引擎不注册，
            冲突检测会提示并请改到单击位置。
          - Linux 识别按 evdev 能力分类（第二摇杆或显式手柄按键），只有摇杆轴
            加踏板、不带显式手柄按键的赛车方向盘类设备可能不被识别为手柄。
          - Windows 上 Guide 键不可用（平台限制）：XInput 的 wButtons 位图
            没有 Guide 位，Windows 通道永不报告该键按下（可视化器 Guide 常灭、
            Guide 映射不触发均为可解释状态）；Linux 上 evdev 经 BTN_MODE 正常
            识别。
          - Leader 临时层与命令提示浮层为本版新增：浮层仅在渲染进程显示，关窗到
            托盘（无渲染窗口）时不显示；临时层每设备默认最多 4 层，层键只能按住
            （Hold）触发。真实键盘与映射同时按住同一按键的输入混用不在输出所有权
            表的处理范围内。

          ### 质量门禁

          发布前本地验证（Linux）：Release 构建 0 警告、0 错误；完整测试共 2053 项，
          2047 通过、0 失败、6 项跳过（Windows 专属 / 跨平台分支），含本轮新增的输出
          所有权、采样间断、手势处理器生命周期、Leader 临时层、曲线强度与命令提示
          浮层回归测试；release.yml 已通过 actionlint；本地另构建 linux-x64 deb，校验
          control 元数据与载荷完整性（hicolor 七尺寸图标、fix-device-access.sh 0755、
          desktop entry），并从解包位置冒烟运行 daemon；rpm / AppImage 本机缺
          rpmbuild / appimagetool，由 Release workflow 构建校验（完整安装 / 卸载循环
          与 Windows Inno 安装器需对应平台运行器，由 Release workflow 验证）。
          Windows / Ubuntu 双平台 CI、四 RID、
          Windows Inno per-user EXE 与 Linux 三种包格式的构建与安装验证由 Release
          workflow 执行；本轮未进行 Windows 真机、物理手柄或人工 GUI 实测，不以自动化
          测试替代人工验收。人工验证清单：[docs/QA-CHECKLIST.md](docs/QA-CHECKLIST.md)

          ### 本版提交

          

          NOTES
          sed -i "s/vVERSION/$VERSION/g; s/PACKAGEVERSION/${VERSION#v}/g" body.md
          echo '```' >> body.md
          if git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            git log --oneline "$(git describe --tags --abbrev=0 HEAD^)..HEAD" >> body.md
          else
            git log --oneline >> body.md
          fi
          echo '```' >> body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # GitHub marks the newest release without the flag as Latest, so
          # --prerelease goes on only when the version carries a prerelease
          # suffix: 0.0.1-beta.5-preview ships as a prerelease, a plain 0.0.1
          # ships without it and is offered as the Latest release. The tag
          # keeps its leading v; the check runs on the version it wraps.
          version='${{ steps.version.outputs.tag }}'
          flags=()
          if [[ "${version#v}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "DeziroJoy ${{ steps.version.outputs.tag }}" \
            --notes-file body.md \
            "${flags[@]}" \
            artifacts/*/*.exe artifacts/*/*.deb artifacts/*/*.rpm artifacts/*/*.AppImage artifacts/*/*.sha256
