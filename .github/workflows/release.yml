name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.0.1-alpha.1-preview)'
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained build
        run: >
          dotnet publish src/DeziroJoy.App
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Smoke check the published binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/DeziroJoy.exe"
          if (-not (Test-Path $exe)) { throw "DeziroJoy.exe missing from publish output" }
          $info = (Get-Item $exe).VersionInfo
          "Product : $($info.ProductName)"
          "Version : $($info.ProductVersion)"
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Version mismatch: $($info.ProductVersion)" }

      # Linux builds carry no PE version resource and the .NET SDK appends +<sha> to
      # InformationalVersion, so the Windows ProductVersion prefix check has no Linux
      # equivalent. Verify the artefact is an ELF executable of the right architecture,
      # then actually run the headless daemon on x64: a binary whose native libraries fail to
      # resolve exits immediately, while a healthy one is still running when timeout kills it,
      # which is exit code 124.
      #
      # Two traps this step has to survive. GitHub's `bash` shell runs with -e, so the expected
      # 124 from timeout would abort the script before it could be inspected - the call is
      # therefore written to capture the code instead of failing. And an aarch64 binary cannot
      # run on an x64 runner at all, so the run check is x64-only; arm64 is verified by the
      # ELF/architecture check above, which is all a cross-published binary can prove here.
      - name: Smoke check the published binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          exe="publish/${{ matrix.rid }}/DeziroJoy"
          test -x "$exe" || { echo "not executable: $exe"; exit 1; }
          case "${{ matrix.rid }}" in
            linux-x64)   want="x86-64" ;;
            linux-arm64) want="aarch64" ;;
            *) echo "unknown rid ${{ matrix.rid }}"; exit 1 ;;
          esac
          got=$(file -b "$exe")
          echo "file: $got"
          echo "$got" | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          echo "$got" | grep -q "$want" || { echo "wrong architecture, wanted $want"; exit 1; }
          if [ "${{ matrix.rid }}" != "linux-x64" ]; then
            echo "cross-compiled for $want, run check needs that architecture - skipped"
            exit 0
          fi
          timeout 10 "$exe" --daemon > daemon.log 2>&1 && code=0 || code=$?
          echo "daemon exit code: $code"
          sed -n '1,20p' daemon.log
          if [ "$code" -ne 124 ]; then
            echo "daemon did not stay running (expected 124 from timeout)"
            exit 1
          fi

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path publish/${{ matrix.rid }}/*
          -DestinationPath DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
          -CompressionLevel Optimal

      # The zip step used to shell out to the `zip` binary, which is not present on the
      # ubuntu-latest runner image. It failed silently - `set -e` aborted the step before
      # anything was printed - and the failure only surfaced 11 seconds later as
      # "sha256sum: ... No such file or directory". Compressing through the .NET SDK that
      # just published the binaries keeps the step dependent on nothing but dotnet.
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          rid='${{ matrix.rid }}'
          out="DeziroJoy-${version}-${rid}.zip"
          dotnet run --project tools/ZipPack -c Release -- "publish/${rid}" "$out"
          test -s "$out" || { echo "no zip produced"; exit 1; }
          ls -la "$out"

      - name: Checksum
        shell: bash
        run: sha256sum "DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip" > "DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
            DeziroJoy-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > body.md <<'NOTES'
          ## DeziroJoy vVERSION (alpha preview)

          本版更新矢量手柄模型与全局预设入口，统一手柄劫持和映射语义，并完善真实设备识别、
          托盘偏好及 GUI / tray / daemon 的 IPC 与生命周期可靠性。仍属 alpha 预览版，
          欢迎按 [QA 清单](docs/QA-CHECKLIST.md) 测试并反馈问题。

          ### 本版更新

          - **矢量手柄模型**：重绘机身、握把、肩键、中心键与 ABXY 的比例和轮廓，
            改善浅色 / 深色主题下的层次与对比，保留模型和真实输入、映射行之间的联动反馈
          - **模型右侧全局预设**：1–4 预设选择器移至手柄模型右侧；活动槽是整个应用唯一且
            持久化的状态，GUI 与 Leader 键经由 daemon 的同一路径切换。所有可切换设备原子重载，
            任一设备失败即回滚，避免出现部分设备已切换的状态
          - **劫持开关与映射语义**：设置中的「劫持手柄按键」改为显式控制输入所有权。
            仅在开启劫持且窗口可见、激活并位于映射页时，实体输入用于导航和编辑器，同时通过
            daemon 租约暂停映射注入；关闭后实体输入始终遵守映射。失焦、离开作用域、关窗或
            断连都会释放租约，隐藏的编辑状态不再继续暂停注入
          - **真实设备识别与输入**：daemon 快照提供当前连接设备的 ID、名称和 Xbox /
            DualShock / 通用布局，GUI 不再虚构设备身份；真实输入样本驱动导航、捕获和模型高亮，
            按键边沿按设备独立保序。设备断开后权威配置切换到剩余设备且不强行覆盖编辑草稿，
            新设备的四个默认槽不会覆盖已有配置
          - **关闭 / 最小化托盘偏好**：两项偏好独立持久化且默认开启。「关闭后退出到托盘」
            关闭时，右上角关闭仅退出 GUI，任务栏关闭执行包含 daemon 的完整退出；
            「最小化后退出到托盘」关闭时保留普通最小化。托盘交接继续保证映射与 daemon 常驻，
            交接失败会恢复窗口或保留可重试的退出状态
          - **IPC 与生命周期可靠性**：daemon 控制连接支持心跳、断线重连、有序快照与输入推送；
            GUI ↔ tray 交接以 Render / Tray 角色应答为完成证明，并处理启动失败、进程死亡、
            重入和实例锁竞争。完整退出优先请求 daemon 优雅停止，未确认停止时不假装成功，
            启动 / 停止失败可诊断并重试，普通交接不会误停 daemon

          ### 下载

          | 文件 | 平台 | 说明 |
          | --- | --- | --- |
          | `DeziroJoy-PACKAGEVERSION-win-x64.zip` | Windows | 自包含，解压即用（无需安装 .NET），Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-win-arm64.zip` | Windows | 同上，ARM64（如骁龙笔记本） |
          | `DeziroJoy-PACKAGEVERSION-linux-x64.zip` | Linux | 自包含，解压即用，Intel / AMD 64 位 |
          | `DeziroJoy-PACKAGEVERSION-linux-arm64.zip` | Linux | 同上，ARM64（如树莓派） |
          | `*.sha256` | — | SHA256 校验和 |

          Linux 版需要系统提供 X11 / Wayland 客户端库（`libX11`、`libxcb` 等，
          桌面发行版默认齐全）与 `evdev` / `uinput` 内核模块。读取手柄只需要
          `evdev`；注入鼠标键盘需要 `/dev/uinput` 可写，若不可写应用会明确报告，
          不会静默失效。

          ### 已知限制

          - Windows 上输入读取走 XInput，只能看到 Xbox 布局的标准按键；
            超出该布局的按键（部分第三方手柄的额外宏键）不会被识别。
          - XInput 无法提供稳定硬件 ID，Windows 上配置按 XInput 槽位（#1-#4）
            保存；两个手柄互换插槽时，配置随槽位而非硬件走。Linux 上 evdev
            提供稳定设备路径，按硬件保存。
          - 常驻服务使用 Windows 计划任务的「登录时」触发器，而非开机启动：
            登录前进程运行在会话 0，无法向用户桌面注入输入。
          - Windows 上 SendInput 受 UIPI 约束：非提权进程无法向提权目标注入
            输入，且失败时错误码不指明源于 UIPI。请使用提权常驻服务。

          ### 质量门禁

          发布前本地验证（Linux）：Release 构建 0 警告、0 错误；完整测试共 1208 项，
          1203 通过、0 失败、5 项 Windows 专属跳过；release.yml 已通过 actionlint。
          Windows / Ubuntu 双平台 CI、四 RID 自包含打包及 smoke check 由 Release workflow
          执行；本轮未进行 Windows 真机或物理手柄实测，不以自动化测试替代人工验收。
          人工验证清单：[docs/QA-CHECKLIST.md](docs/QA-CHECKLIST.md)

          ### 本版提交

          

          NOTES
          sed -i "s/vVERSION/$VERSION/g; s/PACKAGEVERSION/${VERSION#v}/g" body.md
          echo '```' >> body.md
          if git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            git log --oneline "$(git describe --tags --abbrev=0 HEAD^)..HEAD" >> body.md
          else
            git log --oneline >> body.md
          fi
          echo '```' >> body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "DeziroJoy ${{ steps.version.outputs.tag }}" \
            --notes-file body.md \
            --prerelease \
            artifacts/*/*.zip artifacts/*/*.sha256
